# /etc/nginx/conf.d/login-rate-limit.conf
# Ограничение частоты запросов к формам входа. Ключ пустой для остальных
# запросов, поэтому limit_req в location /api/ и location / не влияет на них.
map $uri $login_limit_key {
    default "";
    /api/auth/login $binary_remote_addr;
    /api/accountant/login $binary_remote_addr;
    /api/login $binary_remote_addr;
}

limit_req_zone $login_limit_key zone=login_limit:10m rate=30r/m;
limit_req_status 429;
