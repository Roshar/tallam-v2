services:
  mysql:
    image: mysql:8.0
    container_name: tallam-v2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tallam_root
      MYSQL_DATABASE: govzalla_t_25
      MYSQL_USER: tallam
      MYSQL_PASSWORD: tallam_local
    ports:
      - "3307:3306"
    volumes:
      - tallam_mysql_data:/var/lib/mysql
      # Init/seed scripts are NOT auto-applied — import a real dump instead:
      # npm run db:import -- database/dumps/production.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  mailpit:
    image: axllent/mailpit:latest
    container_name: tallam-v2-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  tallam_mysql_data:
